repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "100"]
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["-j8", "--max-line-length=100", "--ignore=E203,E501,W503"]
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [ --convention=pep257 ]  # The standard!

  # ── Local hook: pyproject.toml version must have an entry in RELEASE_NOTES ──
  - repo: local
    hooks:
      - id: check-version
        name: Version consistent with RELEASE_NOTES.md
        language: python
        entry: python scripts/check_version.py
        pass_filenames: false
        always_run: true
