[tool.poetry]
name = "shiny-app"
version = "0.1.0"
description = "Shiny Python app"
authors = ["David Morley"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
shiny = ">=1.5.1,<2.0.0"
matplotlib = ">=3.10.8,<4.0.0"
folium = ">=0.17.0,<1.0.0"
pandas = ">=2,<3"
stackstac = "^0.5.1"
xarray = ">=2024.7.0,<2025.12"
rioxarray = "^0.21.0"
pystac-client = "^0.9.0"
planetary-computer = "^1.0.0"
tqdm = "^4.67.3"
scipy = "^1.17.0"
cartopy = "^0.25.0"
dask = "^2026.1.2"
geopandas = "^1.1.2"
scikit-learn = "^1.8.0"
statsmodels = "^0.14.6"
rpy2 = "^3.6.4"
ratelimit = "^2.2.1"
anywidget = "^0.9.21"
streamlit-folium = "^0.26.1"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.5.0,<5.0.0"
black = ">=25.12.0,<26.0.0"
flake8 = ">=7.1.0,<8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
