[tool.poetry]
name = "shiny-app"
version = "0.0.1"
description = "Shiny Python app"
authors = ["David Morley <d.morley1@lancaster.ac.uk>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
shiny = ">=1.5.1,<2.0.0"
shinywidgets = ">=0.7.0,<1.0.0"
faicons = ">=0.2.2,<1.0.0"
matplotlib = ">=3.10.8,<4.0.0"
folium = ">=0.17.0,<1.0.0"
leafmap = ">=0.44.0,<1.0.0"
ipyleaflet = ">=0.19.2,<1.0.0"
pandas = ">=2,<3"
stackstac = "^0.5.1"
xarray = ">=2024.7.0,<2025.12"
rioxarray = "^0.21.0"
rasterio = ">=1.3.10,<2.0.0"
requests = ">=2.32.0,<3.0.0"
pyproj = ">=3.7.0,<4.0.0"
shapely = ">=2.0.0,<3.0.0"
pystac-client = "^0.9.0"
planetary-computer = "^1.0.0"
scipy = "^1.17.0"
dask = "^2026.1.2"
geopandas = "^1.1.2"
rpy2 = "^3.6.4"
netcdf4 = "^1.7.4"
pydap = "^3.5.8"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.5.0,<5.0.0"
black = ">=25.12.0,<26.0.0"
flake8 = ">=7.1.0,<8.0.0"

[tool.black]
line-length = 100

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
