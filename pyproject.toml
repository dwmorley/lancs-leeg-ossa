[tool.poetry]
name = "shiny-app"
version = "0.1.0"
description = "Shiny Python app"
authors = ["David Morley"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
shiny = ">=1.5.1,<2.0.0"
matplotlib = ">=3.10.8,<4.0.0"
folium = ">=0.17.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.5.0,<5.0.0"
black = ">=25.12.0,<26.0.0"
flake8 = ">=7.1.0,<8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
