# ── Local development / debug compose file ───────────────────────────────────
# Usage:
#   docker compose up --build          # first run (builds the image locally)
#   docker compose up                  # subsequent runs (re-uses cached image)
#   docker compose down                # stop and remove container

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lancs-leeg-ossa:dev
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # App writes outputs here — maps to ./output on your machine
      - ./output:/app/output
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DOWNLOAD_DIR=/app/output
    restart: unless-stopped
